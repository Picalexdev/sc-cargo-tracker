name: Build & Release Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          pip install pyinstaller pywebview
          pip install fastapi "uvicorn[standard]" python-multipart pydantic
          pip install pillow rapidfuzz pytesseract

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --name "SC Cargo Tracker" `
            --onedir `
            --windowed `
            "--add-data=frontend;frontend" `
            --paths backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import anyio._backends._asyncio `
            --hidden-import pytesseract `
            --exclude-module torch `
            --exclude-module torchvision `
            --exclude-module torchaudio `
            --exclude-module easyocr `
            --exclude-module paddle `
            --exclude-module paddleocr `
            --exclude-module cv2 `
            --exclude-module matplotlib `
            --exclude-module scipy `
            --exclude-module sklearn `
            run.py

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC-Cargo-Tracker-Setup
          path: dist\SC-Cargo-Tracker-Setup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\SC-Cargo-Tracker-Setup.exe
          generate_release_notes: true
